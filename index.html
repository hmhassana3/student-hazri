<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Student Hazri Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-192.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#12211f;--mu:#647572;--pr:#0f766e;--pr2:#14b8a6;--ok:#16a34a;--no:#dc2626;--bd:#e0e7e5;--wa:#d97706}
:root[data-theme=dark]{--bg:#0c1413;--card:#15211f;--tx:#e8f1ef;--mu:#8ea39f;--bd:#233330;--pr:#14b8a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:auto}
[dir=rtl] body,body.ur{font-family:'Noto Naskh Arabic','Plus Jakarta Sans',sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--pr);color:#fff}
header h1{font-size:19px;margin:0;flex:1;font-weight:800}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px 14px 100px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;padding:4px;cursor:pointer}
nav button.on{color:var(--pr)}
nav .plus{color:#fff}nav .plus span{background:var(--pr);border-radius:14px;width:50px;height:38px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,118,110,.4)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800}.stat small,.mu{color:var(--mu);font-size:12.5px}
.hero{background:linear-gradient(135deg,var(--pr),#065f46);color:#fff;border-radius:20px;padding:18px;margin-bottom:10px}
.hero b{font-size:40px;font-weight:800}.hero small{opacity:.85}
h3{margin:16px 2px 8px;font-size:15px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;color:var(--mu)}
.pill{font-weight:700;font-size:13px;padding:3px 9px;border-radius:99px;color:#fff}
.g{background:var(--ok)}.r{background:var(--no)}.y{background:var(--wa)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.w{width:100%}.btn.o{background:none;color:var(--pr);border:1.5px solid var(--pr)}.btn.d{background:var(--no)}.btn.s{padding:7px 10px;font-size:13px}
.ib{border:0;background:var(--bg);color:var(--mu);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.ib.on{color:var(--wa)}.ib.rm:hover{color:var(--no)}
.mk{width:46px;height:46px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;display:grid;place-items:center}
.mk.p.on{background:var(--ok);border-color:var(--ok);color:#fff}.mk.a.on{background:var(--no);border-color:var(--no);color:#fff}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr2)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#md.on{display:flex}#md>div{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.sc{overflow-x:auto}
.pr{display:none}nav button.on:not(.plus) svg{fill:#5eead4;stroke:var(--pr)}nav button.on:not(.plus){font-weight:700}
@media print{header,nav,.np{display:none!important}html,body{height:auto;display:block;max-width:none}main{padding:0;overflow:visible}.pr{display:block!important}}
.ch{width:100%;height:auto;stroke:none;stroke-width:1;color:var(--tx)}
</style>
</head>
<body>
<header><h1 id="ht"></h1><button onclick="menu()" aria-label="menu" id="gear"></button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="md" onclick="if(event.target===this)mc()"><div id="mb"></div></div>
<div id="tt"></div>
<script>
const $=id=>document.getElementById(id);
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',book:'<path d="M4 4h12a4 4 0 014 4v12H8a4 4 0 01-4-4zM4 16a4 4 0 014-4h12"/>',plus:'<path d="M12 5v14M5 12h14"/>',chart:'<rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="8" width="4" height="12" rx="1"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',back:'<path d="M15 5l-7 7 7 7"/>',phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 005 5L15 13l5 2v4a2 2 0 01-2 2A16 16 0 013 6a2 2 0 012-2z"/>',pin:'<path d="M9 3h6l-1 6 3 4H7l3-4zM12 13v8"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',ok:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6M17 4.5a3.5 3.5 0 010 7M22 20c0-3-1.5-5-4-5.5"/>',ret:'<path d="M3 12a9 9 0 109-9M3 4v5h5"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const T={en:{app:'Hazri Manager',home:'Home',classes:'Classes',add:'Add',reports:'Reports',settings:'Settings',lang:'Language',theme:'Theme',light:'Light',dark:'Dark',trash:'Trash',backup:'Backup data',restore:'Restore data',pt:'Present today',at:'Absent today',ses:'Attendance taken today',cls:'Classes',stu:'Students',best:'Best class attendance',low:'Lowest class attendance',top:'Most present student',most:'Most absent student',alert:'Low attendance (below 75%)',today:'Today',none:'Nothing yet',search:'Search name or #code',nc:'No classes yet. Tap + to add one.',cn:'Class name',lv:'Which class / grade',code:'#Code (unique)',nsec:'Number of sections',sname:'Section name',save:'Save',cancel:'Cancel',ok:'OK',codeUsed:'This code is already used',fill:'Fill required fields',sec:'Sections',addStu:'Add student',name:'Student name',father:'Father name',phone:'Phone number',roll:'Roll number',cr:'Reg. #',take:'Take attendance',date:'Date',lect:'Lecture / period name',allP:'Mark all present',reason:'Why is this student absent?',pres:'Present',abs:'Absent',mark:'Mark every student first',saved:'Attendance saved',hist:'Attendance history',call:'Call',inCls:'Class',absDays:'Absent days',pct:'Attendance %',del:'Delete',sure:'Are you sure?',restoreB:'Restore',delF:'Delete forever',old:'has been in trash for 6+ months. Delete it permanently?',noTrash:'Trash is empty',month:'Month',year:'Year',all:'All classes',dl:'Download CSV',print:'Print',sect:'Section',students:'students',noStu:'No students yet',pin:'Pin',rm:'Move to trash',moved:'Moved to trash',days:'days ago',fa:'Father',sound:'Click sound',on:'On',off:'Off',share:'Share',shareAll:'Share all data',insti:'In Safari tap the Share button, then "Add to Home Screen".',instd:'This app is already installed.',inst:'Add app shortcut to home screen',instq:'Do you want to add this app to your home screen?',yes:'Yes',no:'No',insth:'In Chrome tap the ⋮ menu, then choose "Add to Home screen" or "Install app".',s1:'Attendance % (high to low)',s2:'Attendance % (low to high)',s3:'Most absent first',s4:'Name A–Z',s5:'Class A–Z',search2:'Search name, roll, Reg. #, #code',lowest:'Least present student',graph:'Graph',bar:'Bar graph',line:'Line graph'},
ur:{app:'حاضری منیجر',home:'ہوم',classes:'کلاسز',add:'نیا',reports:'رپورٹس',settings:'سیٹنگز',lang:'زبان',theme:'تھیم',light:'روشن',dark:'تاریک',trash:'ٹریش',backup:'ڈیٹا بیک اپ',restore:'ڈیٹا واپس لائیں',pt:'آج حاضر',at:'آج غیر حاضر',ses:'آج کی حاضریاں',cls:'کلاسز',stu:'طلبہ',best:'بہترین حاضری والی کلاس',low:'سب سے کم حاضری والی کلاس',top:'سب سے زیادہ حاضر طالب علم',most:'سب سے زیادہ غیر حاضر طالب علم',alert:'کم حاضری (75٪ سے کم)',today:'آج',none:'ابھی کچھ نہیں',search:'نام یا #کوڈ سے تلاش کریں',nc:'ابھی کوئی کلاس نہیں۔ + دبا کر بنائیں۔',cn:'کلاس کا نام',lv:'کون سی جماعت',code:'#کوڈ (منفرد)',nsec:'سیکشنز کی تعداد',sname:'سیکشن کا نام',save:'محفوظ کریں',cancel:'منسوخ',ok:'ٹھیک ہے',codeUsed:'یہ کوڈ پہلے سے استعمال ہو چکا ہے',fill:'ضروری خانے پُر کریں',sec:'سیکشنز',addStu:'طالب علم شامل کریں',name:'طالب علم کا نام',father:'والد کا نام',phone:'فون نمبر',roll:'رول نمبر',cr:'رجسٹریشن نمبر (Reg. #)',take:'حاضری لگائیں',date:'تاریخ',lect:'لیکچر / پیریڈ کا نام',allP:'سب کو حاضر کریں',reason:'یہ طالب علم غیر حاضر کیوں ہے؟',pres:'حاضر',abs:'غیر حاضر',mark:'پہلے ہر طالب علم کی حاضری لگائیں',saved:'حاضری محفوظ ہو گئی',hist:'حاضری کی تاریخ',call:'کال',inCls:'جماعت',absDays:'غیر حاضری کے دن',pct:'حاضری ٪',del:'حذف کریں',sure:'کیا آپ کو یقین ہے؟',restoreB:'بحال کریں',delF:'ہمیشہ کے لیے حذف',old:'کو ٹریش میں 6 ماہ سے زیادہ ہو گئے۔ کیا اسے مکمل حذف کر دیں؟',noTrash:'ٹریش خالی ہے',month:'مہینہ',year:'سال',all:'تمام کلاسز',dl:'CSV ڈاؤنلوڈ',print:'پرنٹ',sect:'سیکشن',students:'طلبہ',noStu:'ابھی کوئی طالب علم نہیں',pin:'پن',rm:'ٹریش میں بھیجیں',moved:'ٹریش میں بھیج دی گئی',days:'دن پہلے',fa:'والد',sound:'کلک کی آواز',on:'آن',off:'آف',share:'شیئر',shareAll:'تمام ڈیٹا شیئر کریں',insti:'سفاری میں شیئر بٹن دبائیں، پھر "Add to Home Screen" چنیں۔',instd:'یہ ایپ پہلے سے انسٹال ہے۔',inst:'ایپ کا شارٹ کٹ ہوم اسکرین پر بنائیں',instq:'کیا آپ اس ایپ کو ہوم اسکرین پر شامل کرنا چاہتے ہیں؟',yes:'جی ہاں',no:'نہیں',insth:'کروم میں ⋮ مینو دبائیں، پھر "Add to Home screen" یا "Install app" چنیں۔',s1:'حاضری ٪ (زیادہ سے کم)',s2:'حاضری ٪ (کم سے زیادہ)',s3:'سب سے زیادہ غیر حاضر پہلے',s4:'نام A–Z',s5:'کلاس A–Z',search2:'نام، رول، Reg. #، #کوڈ سے تلاش کریں',lowest:'سب سے کم حاضر طالب علم',graph:'گراف',bar:'بار گراف',line:'لائن گراف'}};
let S=JSON.parse(localStorage.getItem('hazri')||'null')||{lang:'en',theme:'light',classes:[]};
const save=()=>localStorage.setItem('hazri',JSON.stringify(S));
const t=k=>(T[S.lang]||T.en)[k]||T.en[k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const tod=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
let R={v:'home'},H=[],q='',att=null,qs='',SS='pctd',G={type:'bar'},dp=null;
const live=()=>S.classes.filter(c=>!c.trashed);
const cl=id=>S.classes.find(c=>c.id===id);
function go(v,p={}){H.push(R);R={v,...p};qs='';draw();$('app').scrollTop=0}
function back(){R=H.pop()||{v:'home'};draw()}
function tab(v){H=[];R={v};qs='';draw()}
function toast(m){const e=$('tt');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',1800)}
function modal(h){$('mb').innerHTML=h;$('md').classList.add('on')}
function mc(){$('md').classList.remove('on')}
function ask(msg,cb,label){window._cb=cb;modal(`<p>${msg}</p><div class=row><button class="btn o sp" onclick="mc()">${t('cancel')}</button><button class="btn d sp" onclick="mc();_cb()">${label||t('ok')}</button></div>`)}
// stats
const secOf=(c,id)=>c.sections.find(s=>s.id===id);
function stOf(c,s){let p=0,a=0,ds=[];c.sessions.forEach(x=>{if(x.sec!==s.sec)return;const m=x.marks[s.id];if(!m)return;if(m.s==='P')p++;else{a++;ds.push({d:x.date,l:x.title,r:m.r})}});const n=p+a;return{p,a,n,pct:n?Math.round(p*100/n):null,ds}}
function clsPct(c){let p=0,n=0;c.students.forEach(s=>{const x=stOf(c,s);p+=x.p;n+=x.n});return n?Math.round(p*100/n):null}
const pc=p=>p==null?'y':p>=85?'g':p>=75?'y':'r';
const pillP=p=>`<span class="pill ${pc(p)}">${p==null?'–':p+'%'}</span>`;
// draw
function draw(){
 document.documentElement.dir=S.lang==='ur'?'rtl':'ltr';document.documentElement.lang=S.lang;document.body.className=S.lang;
 document.documentElement.dataset.theme=S.theme;
 $('gear').innerHTML=ic('menu');
 const main=['home','classes','add','students','reports'].includes(R.v);
 const nv=[['home','home'],['classes','book'],['add','plus'],['students','users'],['reports','chart']];
 $('nav').style.display=main?'flex':'none';
 $('nav').innerHTML=nv.map(([k,i])=>`<button class="${R.v===k?'on':''} ${k==='add'?'plus':''}" onclick="tab('${k}')">${k==='add'?`<span>${ic(i)}</span>`:ic(i)+`<span>${t(k==='students'?'stu':k)}</span>`}</button>`).join('');
 const titles={students:t('stu'),home:t('home'),classes:t('classes'),add:t('add'),reports:t('reports'),settings:t('settings'),trash:t('trash')};
 let title=titles[R.v]||t('app'),h='';
 if(main)title=t('app')+' — '+title;
 const c=R.c&&cl(R.c);
 if(R.v==='home')h=vHome();
 else if(R.v==='classes')h=vClasses();
 else if(R.v==='add')h=vAdd();
 else if(R.v==='reports')h=vReports();
 else if(R.v==='settings')h=vSet();
 else if(R.v==='trash'){h=vTrash()}
 else if(R.v==='today'){title=t('today');h=vToday()}
 else if(R.v==='students'){h=vStudents()}
 else if(R.v==='rank'&&c){title=c.name;h=vRank(c)}
 else if(R.v==='graph'){title=t('graph');h=vGraph()}
 else if(R.v==='class'&&c){title=c.name;h=vPick(c)}
 else if(R.v==='sec'&&c){title=c.name+(secOf(c,R.s).name?' · '+secOf(c,R.s).name:'');h=vSec(c)}
 else if(R.v==='att'&&c){title=t('take');h=vAtt(c)}
 else if(R.v==='stu'&&c){const s=c.students.find(x=>x.id===R.st);title=s.name;h=vStu(c,s)}
 $('ht').innerHTML=(main?'':`<span onclick="back()" style="cursor:pointer;display:inline-flex;vertical-align:middle;${S.lang==='ur'?'transform:scaleX(-1)':''}">${ic('back')}</span> `)+esc(title);
 $('app').innerHTML=h;
 if(R.v==='classes')drawList();
 if(['students','rank','sec'].includes(R.v))drawS();
 if(R.v==='trash')trashCheck();
 if(R.v==='add')secFields();
}
// HOME
function vHome(){
 const cs=live();let tp=0,ta=0,ts=0;const d=tod(),all=allS(cs).filter(x=>x.n);
 cs.forEach(c=>c.sessions.filter(x=>x.date===d).forEach(x=>{ts++;Object.values(x.marks).forEach(m=>m.s==='P'?tp++:ta++)}));
 const cp=cs.map(c=>({c,p:clsPct(c)})).filter(x=>x.p!=null).sort((a,b)=>b.p-a.p);
 const top=[...all].sort((a,b)=>b.pct-a.pct||b.p-a.p)[0],most=[...all].sort((a,b)=>b.a-a.a)[0];
 const lowS=all.filter(x=>x.pct<75).sort((a,b)=>a.pct-b.pct).slice(0,5);
 const ns=cs.reduce((n,c)=>n+c.students.length,0),tot=tp+ta;
 const sg=x=>`go('stu',{c:'${x.c.id}',st:'${x.s.id}'})`;
 const row=(l,n,sub,p,oc)=>`<div class="card row" style="cursor:pointer" onclick="${oc}"><div class=sp><small class=mu>${l}</small><div><b>${esc(n)}</b></div><small class=mu>${esc(sub||'')}</small></div>${pillP(p)}</div>`;
 return `<div class=hero style="cursor:pointer" onclick="go('today')"><small>${t('today')} · ${d}</small><div><b>${tot?Math.round(tp*100/tot):0}%</b></div><small>${t('pt')}: ${tp} · ${t('at')}: ${ta} · ${t('ses')}: ${ts}</small></div>
 <div class=grid><div class=stat style="cursor:pointer" onclick="tab('classes')"><b>${cs.length}</b><small>${t('cls')}</small></div><div class=stat style="cursor:pointer" onclick="tab('students')"><b>${ns}</b><small>${t('stu')}</small></div></div>
 ${cp.length?row(t('best'),cp[0].c.name,'#'+cp[0].c.code,cp[0].p,`go('rank',{c:'${cp[0].c.id}'})`)+(cp.length>1?row(t('low'),cp.at(-1).c.name,'#'+cp.at(-1).c.code,cp.at(-1).p,`go('rank',{c:'${cp.at(-1).c.id}'})`):''):''}
 ${top?row(t('top'),top.s.name,top.c.name+' · '+top.p+' '+t('pres'),top.pct,sg(top)):''}
 ${most&&most.a?row(t('most'),most.s.name,most.c.name+' · '+most.a+' '+t('abs'),most.pct,sg(most)):''}
 ${lowS.length?`<h3>${t('alert')}</h3>`+lowS.map(x=>row(x.s.name,x.s.name,x.c.name,x.pct,sg(x)).replace(`<small class=mu>${esc(x.s.name)}</small><div><b>${esc(x.s.name)}</b></div>`,`<b>${esc(x.s.name)}</b><br>`)).join(''):''}
 ${!cs.length?`<div class=empty>${t('nc')}</div>`:''}`
