<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Hazri Manager</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6f5;--card:#fff;--tx:#12211f;--mu:#647572;--pr:#0f766e;--pr2:#14b8a6;--ok:#16a34a;--no:#dc2626;--bd:#e0e7e5;--wa:#d97706}
:root[data-theme=dark]{--bg:#0c1413;--card:#15211f;--tx:#e8f1ef;--mu:#8ea39f;--bd:#233330;--pr:#14b8a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font-family:'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:auto}
[dir=rtl] body,body.ur{font-family:'Noto Naskh Arabic','Plus Jakarta Sans',sans-serif;line-height:1.7}
header{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--pr);color:#fff}
header h1{font-size:19px;margin:0;flex:1;font-weight:800}
header button{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px 14px 100px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:720px;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;border:0;background:none;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:11px;padding:4px;cursor:pointer}
nav button.on{color:var(--pr)}
nav .plus{color:#fff}nav .plus span{background:var(--pr);border-radius:14px;width:50px;height:38px;display:grid;place-items:center;box-shadow:0 4px 12px rgba(15,118,110,.4)}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px}
.stat b{display:block;font-size:26px;font-weight:800}.stat small,.mu{color:var(--mu);font-size:12.5px}
.hero{background:linear-gradient(135deg,var(--pr),#065f46);color:#fff;border-radius:20px;padding:18px;margin-bottom:10px}
.hero b{font-size:40px;font-weight:800}.hero small{opacity:.85}
h3{margin:16px 2px 8px;font-size:15px}
.row{display:flex;align-items:center;gap:10px}.sp{flex:1;min-width:0}
.tag{font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:2px 8px;color:var(--mu)}
.pill{font-weight:700;font-size:13px;padding:3px 9px;border-radius:99px;color:#fff}
.g{background:var(--ok)}.r{background:var(--no)}.y{background:var(--wa)}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.w{width:100%}.btn.o{background:none;color:var(--pr);border:1.5px solid var(--pr)}.btn.d{background:var(--no)}.btn.s{padding:7px 10px;font-size:13px}
.ib{border:0;background:var(--bg);color:var(--mu);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer}
.ib.on{color:var(--wa)}.ib.rm:hover{color:var(--no)}
.mk{width:46px;height:46px;border-radius:14px;border:2px solid var(--bd);background:var(--card);color:var(--mu);cursor:pointer;display:grid;place-items:center}
.mk.p.on{background:var(--ok);border-color:var(--ok);color:#fff}.mk.a.on{background:var(--no);border-color:var(--no);color:#fff}
.bar{height:8px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--pr2)}
#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
#md.on{display:flex}#md>div{background:var(--card);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
#tt{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;z-index:30;display:none}
.empty{text-align:center;color:var(--mu);padding:40px 10px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:start}
.sc{overflow-x:auto}
.pr{display:none}nav button.on:not(.plus) svg{fill:#5eead4;stroke:var(--pr)}nav button.on:not(.plus){font-weight:700}

/* ===== Responsive: Phone (default) keeps current look ===== */

/* ===== Tablet & Laptop / Desktop (≥ 900px) ===== */
@media (min-width: 900px) {
  body {
    max-width: 1200px;
    margin: 0 auto;
    flex-direction: row;
    height: 100vh;
    overflow: hidden;
  }
  header {
    position: fixed;
    top: 0;
    left: 220px;
    right: 0;
    max-width: calc(1200px - 220px);
    margin: 0 auto;
    z-index: 10;
    border-radius: 0 0 16px 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,.08);
  }
  main {
    margin-left: 220px;
    margin-top: 64px;
    padding: 24px 28px 40px;
    height: calc(100vh - 64px);
    overflow-y: auto;
    width: calc(100% - 220px);
    max-width: 980px;
  }
  nav {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    width: 220px;
    max-width: 220px;
    transform: none;
    flex-direction: column;
    justify-content: flex-start;
    padding: 20px 12px;
    border-top: none;
    border-right: 1px solid var(--bd);
    background: var(--card);
    gap: 4px;
    z-index: 15;
  }
  nav button {
    flex-direction: row;
    justify-content: flex-start;
    gap: 12px;
    padding: 12px 14px;
    font-size: 14px;
    border-radius: 12px;
    width: 100%;
  }
  nav button span {
    font-size: 14px;
  }
  nav .plus span {
    width: 36px;
    height: 36px;
    border-radius: 10px;
  }
  nav button.on {
    background: color-mix(in srgb, var(--pr) 12%, transparent);
  }
  /* wider grids on desktop */
  .grid {
    grid-template-columns: repeat(4, 1fr);
  }
  .card, .stat, .hero {
    border-radius: 18px;
  }
  /* modal as centered dialog on desktop */
  #md {
    align-items: center;
    justify-content: center;
  }
  #md > div {
    max-width: 480px;
    border-radius: 20px;
    margin: 20px;
    max-height: 85vh;
    overflow-y: auto;
  }
  #tt {
    bottom: 40px;
  }
}

@media (min-width: 900px) {
  body:has(nav[style*="display: none"]) header,
  body:has(nav[style*="display: none"]) main {
    left: 0 !important;
    margin-left: 0 !important;
    width: 100% !important;
    max-width: 100% !important;
  }
  body:has(nav[style*="display: none"]) header {
    max-width: 1200px;
    left: 50%;
    transform: translateX(-50%);
  }
}

/* Extra large screens */
@media (min-width: 1400px) {
  body { max-width: 1320px; }
  header { left: 240px; max-width: calc(1320px - 240px); }
  main { margin-left: 240px; width: calc(100% - 240px); max-width: 1080px; }
  nav { width: 240px; max-width: 240px; }
}

@media print{header,nav,.np{display:none!important}html,body{height:auto;display:block;max-width:none}main{padding:0;overflow:visible}.pr{display:block!important}}
.ch{width:100%;height:auto;stroke:none;stroke-width:1;color:var(--tx)}

</style>
</head>
<body>
<header><h1 id="ht"></h1><button onclick="menu()" aria-label="menu" id="gear"></button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="md" onclick="if(event.target===this)mc()"><div id="mb"></div></div>
<div id="tt"></div>
<script>
